# Quartz v5 配置文件
# 个人定制版（2026-07-13）

configuration:
  pageTitle: "小M-Quartz"
  pageTitleSuffix: " | 蒙塔理斯"
  enableSPA: true
  enablePopovers: true
  analytics:
    provider: plausible
  locale: "zh-CN"
  baseUrl: "holdyounger.github.io"
  ignorePatterns:
    - private
    - templates
    - .obsidian
    - .smart-env
    - .trash
    - ".github"
    - ".git"
    - "env.js"
    - "robots.txt"
    - "_drafts"
    - "_data"
    - "js"
    - "Cover"
    - "images"
    - "xmind"
    - "categories"
    - "tags"
    - "more/music"
  theme:
    fontOrigin: googleFonts
    cdnCaching: true
    typography:
      header: "Noto Sans SC"
      body: "Noto Sans SC"
      code: "JetBrains Mono"
    colors:
      lightMode:
        light: "#faf8f8"
        lightgray: "#e5e5e5"
        gray: "#b8b8b8"
        darkgray: "#4e4e4e"
        dark: "#2b2b2b"
        secondary: "#284b63"
        tertiary: "#84a59d"
        highlight: "rgba(143, 159, 169, 0.15)"
        textHighlight: "#fff23688"
      darkMode:
        light: "#161618"
        lightgray: "#393639"
        gray: "#646464"
        darkgray: "#d4d4d4"
        dark: "#ebebec"
        secondary: "#7b97aa"
        tertiary: "#84a59d"
        highlight: "rgba(143, 159, 169, 0.15)"
        textHighlight: "#b3aa0288"

plugins:
  # ===== Transformers =====
  - source: github:quartz-community/created-modified-date
    enabled: true
    options:
      defaultDateType: modified
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10

  - source: github:quartz-community/syntax-highlighting
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20

  - source: github:quartz-community/obsidian-flavored-markdown
    enabled: true
    options:
      enableInHtmlEmbed: false
      enableCheckbox: true
    order: 30

  - source: github:quartz-community/github-flavored-markdown
    enabled: true
    order: 40

  - source: github:quartz-community/table-of-contents
    enabled: true
    order: 50

  - source: github:quartz-community/crawl-links
    enabled: true
    options:
      markdownLinkResolution: shortest
    order: 60

  - source: github:quartz-community/description
    enabled: true
    order: 70

  - source: github:quartz-community/latex
    enabled: true
    order: 80

  # ===== Filters =====
  - source: github:quartz-community/remove-draft
    enabled: true

  # ===== Emitters =====
  - source: github:quartz-community/alias-redirects
    enabled: true

  - source: github:quartz-community/content-index
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true

  - source: github:quartz-community/favicon
    enabled: true

  - source: github:quartz-community/og-image
    enabled: true

  - source: github:quartz-community/cname
    enabled: false

  - source: github:quartz-community/canvas-page
    enabled: true

  - source: github:quartz-community/content-page
    enabled: true

  - source: github:quartz-community/folder-page
    enabled: true

  - source: github:quartz-community/tag-page
    enabled: true

  - source: github:quartz-community/bases-page
    enabled: true

  # ===== UI Components =====
  - source: github:quartz-community/explorer
    enabled: true
    order: 50

  - source: github:quartz-community/graph
    enabled: true
    order: 10

  - source: github:quartz-community/search
    enabled: true
    order: 20

  - source: github:quartz-community/backlinks
    enabled: true
    order: 30

  - source: github:quartz-community/article-title
    enabled: true
    order: 10

  - source: github:quartz-community/content-meta
    enabled: true
    order: 20

  - source: github:quartz-community/page-title
    enabled: true
    order: 10

  - source: github:quartz-community/darkmode
    enabled: true
    layout:
      position: left
      priority: 30
      group: toolbar

  - source: github:quartz-community/reader-mode
    enabled: true
    layout:
      position: left
      priority: 35
      group: toolbar

  - source: github:quartz-community/breadcrumbs
    enabled: true
    layout:
      position: beforeBody
      priority: 5
      condition: not-index

  - source: github:quartz-community/footer
    enabled: true
    options:
      links:
        GitHub: "https://github.com/holdyounger/holdyounger.github.io"

  - source: github:quartz-community/note-properties
    enabled: true
    options:
      includeAll: false
      includedProperties:
        - description
        - tags
        - aliases
      excludedProperties: []
      hidePropertiesView: false
      delimiters: "---"
      language: yaml
    order: 5
    layout:
      position: beforeBody
      priority: 15
      display: all

  - source: github:quartz-community/spacer
    enabled: true
    options: {}
    order: 25
    layout:
      position: left
      priority: 25
      display: mobile-only

  - source: github:quartz-community/unlisted-pages
    enabled: true
    order: 45

  - source: github:quartz-community/encrypted-pages
    enabled: false

layout:
  groups:
    toolbar:
      priority: 35
      direction: row
      gap: 0.5rem

  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    content: {}
    folder:
      exclude:
        - reader-mode
      positions:
        right: []
    tag:
      exclude:
        - reader-mode
      positions:
        right: []
    canvas: {}
    bases: {}
